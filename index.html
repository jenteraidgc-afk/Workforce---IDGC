<script>
// ============ CONFIG ============
const API = 'https://script.google.com/macros/s/AKfycbzkAS-C4KUmrGca9LgO-VzJ0SUhlq3d6wpL0gLJ2MVvNzgVKgfyBZqHkRgvgY_xzhf9/exec';
const EMAIL = 'jentera.idgc@gmail.com';
const CACHE_TTL = 5 * 60 * 1000; // 5 minutes in milliseconds
const CACHE_VERSION = 'v2';

// Hardcoded periods — reliable, no API call needed
const PERIODS = {
  month: [
    'September 2026', 'August 2026', 'July 2026', 'June 2026',
    'May 2026', 'April 2026', 'March 2026', 'February 2026', 'January 2026',
    'December 2025', 'November 2025', 'October 2025', 'September 2025',
    'August 2025', 'July 2025'
  ],
  quarter: ['Q3 2026', 'Q2 2026', 'Q1 2026', 'Q4 2025', 'Q3 2025'],
  year: ['2026', '2025']
};

let currentPage = 'overview';
let periodMode = 'month';
let currentPeriod = 'September 2026';

// ============ ENHANCED CLIENT-SIDE CACHE ============
class SmartCache {
  constructor() {
    this.cache = new Map();
    this.hits = 0;
    this.misses = 0;
    this.loadFromLocalStorage();
  }
  _getCacheKey(action, period, extra) {
    return `${action}|${period}|${JSON.stringify(extra || {})}`;
  }
  get(action, period, extra = {}) {
    const key = this._getCacheKey(action, period, extra);
    const entry = this.cache.get(key);
    if (!entry) { this.misses++; this.updateStatus(); return null; }
    const age = Date.now() - entry.timestamp;
    if (age > CACHE_TTL) {
      this.cache.delete(key); this.misses++; this.updateStatus(); return null;
    }
    this.hits++; this.updateStatus();
    return entry.data;
  }
  set(action, period, extra = {}, data) {
    const key = this._getCacheKey(action, period, extra);
    this.cache.set(key, { data, timestamp: Date.now() });
    this.saveToLocalStorage();
    this.updateStatus();
  }
  clear() {
    this.cache.clear(); this.hits = 0; this.misses = 0;
    localStorage.removeItem('wf_cache');
    this.updateStatus();
  }
  saveToLocalStorage() {
    try {
      const data = Array.from(this.cache.entries()).map(([key, value]) => [key, value]);
      localStorage.setItem('wf_cache', JSON.stringify(data));
    } catch (e) { console.warn('Failed to save cache:', e); }
  }
  loadFromLocalStorage() {
    try {
      const stored = localStorage.getItem('wf_cache');
      if (stored) {
        const data = JSON.parse(stored);
        const now = Date.now();
        data.forEach(([key, value]) => {
          if (now - value.timestamp < CACHE_TTL) this.cache.set(key, value);
        });
      }
    } catch (e) { console.warn('Failed to load cache:', e); }
  }
  updateStatus() {
    const total = this.hits + this.misses;
    const hitRate = total > 0 ? Math.round((this.hits / total) * 100) : 0;
    const size = this.cache.size;
    const statusEl = document.getElementById('cacheStatus');
    if (statusEl) {
      statusEl.textContent = `Cache: ${size} entries, ${hitRate}% hit rate`;
      statusEl.title = `${this.hits} hits, ${this.misses} misses`;
    }
  }
  getStats() {
    return {
      size: this.cache.size, hits: this.hits, misses: this.misses,
      hitRate: this.hits + this.misses > 0 ? (this.hits / (this.hits + this.misses)) * 100 : 0
    };
  }
}
const clientCache = new SmartCache();

// ============ API ============
async function api(action, extra = {}) {
  const cached = clientCache.get(action, currentPeriod, extra);
  if (cached !== null) return cached;
  const params = new URLSearchParams({ action, email: EMAIL, period: currentPeriod, ...extra });
  try {
    const res = await fetch(`${API}?${params}`);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'API error');
    clientCache.set(action, currentPeriod, extra, json.data);
    return json.data;
  } catch (error) {
    console.error('API call failed:', error);
    throw error;
  }
}

// ============ PERIODS ============
function populatePeriodSelect() {
  const sel = document.getElementById('periodSelect');
  const list = PERIODS[periodMode];
  sel.innerHTML = list.map(v => `<option value="${v}">${v}</option>`).join('');
  if (list.includes(currentPeriod)) {
    sel.value = currentPeriod;
  } else {
    currentPeriod = list[0];
    sel.value = currentPeriod;
  }
}

// ============ UTILITIES ============
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]); }
function round(n) { return Math.round(Number(n || 0) * 100) / 100; }
function badge(v, good, warn) {
  const color = v >= good ? 'text-green-600' : v >= warn ? 'text-amber-600' : 'text-red-600';
  return `<span class="${color} font-semibold">${round(v)}</span>`;
}

        <div class="text-slate-400 text-xs mt-1">Across all agents</div>
      </div>

        <div class="text-slate-500 text-xs font-medium mb-1">AVG KPI</div>
        <div class="text-3xl font-bold text-slate-900">${round(overview.avgKPI)}</div>
        <div class="text-slate-400 text-xs mt-1">Out of 100</div>
      </div>
      <div class="bg-white rounded-xl p-5 shadow-sm">
        <div class="text-slate-500 text-xs font-medium mb-1">PERIOD</div>
        <div class="text-base font-bold text-slate-900 mt-1 truncate">${esc(overview.period || currentPeriod)}</div>
        <div class="text-slate-400 text-xs mt-1 capitalize">${periodMode}</div>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-5 mb-8">
      <div class="bg-white rounded-xl p-5 shadow-sm">
        <div class="flex items-center gap-2 mb-4"><span class="w-2 h-2 rounded-full bg-green-500"></span><h3 class="font-semibold text-slate-900">Top Performers</h3></div>
        <div class="space-y-3">
          ${performers.slice(0, 5).map((p, i) => `
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3 min-w-0">
                <span class="text-slate-400 text-sm font-medium w-4">${i+1}</span>
                <div class="min-w-0">

                  <div class="text-xs text-slate-400 truncate">${esc(p.team || '')}</div>
                </div>
              </div>
              <div class="text-green-600 font-semibold text-sm">${round(p.qa)}%</div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="bg-white rounded-xl p-5 shadow-sm">
        <div class="flex items-center gap-2 mb-4"><span class="w-2 h-2 rounded-full bg-red-500"></span><h3 class="font-semibold text-slate-900">Needs Coaching</h3></div>
        <div class="space-y-3">
          ${lowPerformers.map((p, i) => `
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3 min-w-0">
                <span class="text-slate-400 text-sm font-medium w-4">${i+1}</span>
                <div class="min-w-0">
                  <div class="text-sm font-medium text-slate-800 truncate">${esc(p.name)}</div>
                  <div class="text-xs text-slate-400 truncate">${esc(p.team || '')}</div>
                </div>
              </div>
              <div class="text-red-600 font-semibold text-sm">${round(p.qa)}%</div>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="bg-white rounded-xl p-5 shadow-sm">
        <div class="flex items-center gap-2 mb-4"><span class="w-2 h-2 rounded-full bg-blue-500"></span><h3 class="font-semibold text-slate-900">Top Markdowns</h3></div>
        <div class="space-y-2" id="markdownsPanel">
          <div class="text-slate-400 text-xs">Loading...</div>
        </div>
      </div>
    </div>
    <div class="bg-white rounded-xl p-5 shadow-sm">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold text-slate-900">📈 Performance Trends</h3>
        <span class="text-xs text-slate-400">Top 5 vs Bottom 5</span>
      </div>
      <div class="h-80"><canvas id="trendChart"></canvas></div>
    </div>
  `;

  // Load markdowns asynchronously (doesn't block page render)
  api('markdowns', { scope: 'all' }).then(m => {
    const panel = document.getElementById('markdownsPanel');
    if (!panel) return;
    panel.innerHTML = m.slice(0, 5).map((md, i) => `

        </div>

  }).catch(() => {
    const panel = document.getElementById('markdownsPanel');
    if (panel) panel.innerHTML = '<div class="text-slate-400 text-xs">Unable to load</div>';
  });

  // Load trend chart asynchronously
  api('qaTrends').then(trends => {
    const datasets = [];
    const greenColors = ['#16a34a', '#22c55e', '#4ade80', '#86efac', '#bbf7d0'];
    trends.top5.forEach((agent, i) => {
      datasets.push({
        label: agent.name, data: agent.data,
        borderColor: greenColors[i], backgroundColor: greenColors[i],

    });

    trends.bottom5.forEach((agent, i) => {
      datasets.push({
        label: agent.name, data: agent.data,
        borderColor: redColors[i], backgroundColor: redColors[i],
        borderWidth: 2, tension: 0.3, pointRadius: 3, pointHoverRadius: 5,
        borderDash: [5, 5]
      });
    });
    new Chart(document.getElementById('trendChart'), {
      type: 'line',
      data: { labels: trends.months, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { display: true, position: 'bottom', labels: { usePointStyle: true, padding: 10, font: { size: 10 } } },
          tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${round(ctx.parsed.y)}%` } }

        scales: {

          x: { title: { display: true, text: 'Month' } }
        }
      }
    });
  }).catch(err => console.error('Failed to load trends:', err));

const renderers = {
  overview: renderOverview,
  kpi: renderKPI,
  markdowns: renderMarkdowns,
  teams: renderTeams,
  agents: renderAgents,
  attendance: async () => { document.getElementById('content').innerHTML = '<div class="text-slate-400 text-center py-20">Coming soon</div>'; },
  daf: async () => { document.getElementById('content').innerHTML = '<div class="text-slate-400 text-center py-20">Coming soon</div>'; },
  appointments: async () => { document.getElementById('content').innerHTML = '<div class="text-slate-400 text-center py-20">Coming soon</div>'; },
  users: async () => { document.getElementById('content').innerHTML = '<div class="text-slate-400 text-center py-20">Coming soon</div>'; },
};

async function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  document.getElementById('pageTitle').textContent =
    { overview: 'Dashboard Overview', kpi: 'KPI Report', markdowns: 'Markdown Analytics', teams: 'Team Management', agents: 'Agents / CSRs', attendance: 'Attendance', daf: 'DAF Tracker', appointments: 'Appointments', users: 'Users' }[page] || page;
  document.getElementById('content').innerHTML = '<div class="text-center py-20 text-slate-400">Loading...</div>';
  try {
    await renderers[page]();
    const stats = clientCache.getStats();
    document.getElementById('lastSync').textContent = `Last synced ${new Date().toLocaleString()} · ${currentPeriod} · Cache: ${Math.round(stats.hitRate)}% hit rate`;
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="bg-red-50 text-red-700 p-4 rounded-lg">Error: ${esc(e.message)}</div>`;
  }
}

document.querySelectorAll('.sidebar-item').forEach(el => {
  el.addEventListener('click', (e) => { e.preventDefault(); navigate(el.dataset.page); });
});

document.querySelectorAll('.period-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    periodMode = btn.dataset.mode;
    document.querySelectorAll('.period-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === periodMode);
      b.classList.toggle('text-slate-600', b.dataset.mode !== periodMode);
    });
    populatePeriodSelect();
    navigate(currentPage);
  });
});

document.getElementById('periodSelect').addEventListener('change', (e) => {
  currentPeriod = e.target.value;
  navigate(currentPage);
});

document.getElementById('clearCacheBtn').addEventListener('click', () => {
  clientCache.clear();
  navigate(currentPage);
});

populatePeriodSelect();
navigate('overview');
</script>
</body>
</html>
