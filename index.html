<div id="toast" class="hidden fixed top-6 right-6 z-[60] bg-white border border-green-200 text-green-700 px-4 py-2.5 rounded-lg shadow-lg text-sm font-medium flex items-center gap-2">
  <span>✓</span><span id="toastText">Loaded</span>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzkAS-C4KUmrGca9LgO-VzJ0SUhlq3d6wpL0gLJ2MVvNzgVKgfyBZqHkRgvgY_xzhf9/exec';
const FETCH_TIMEOUT_MS = 60000;
const TOKEN_KEY = 'wf_session_token';

let session = null; // { token, email, name, role }
let currentPage = 'overview';
let periodMode = 'month';
let currentPeriod = '';
let PERIODS = { month: [], quarter: [], year: [] };
let attendanceTabs = null;
let currentAttendanceTabName = '';

const PAGE_LABELS = {
  overview: 'Dashboard Overview', kpi: 'KPI Report', markdowns: 'Markdown Analytics',
  teams: 'Team Management', agents: 'Agents / CSRs', attendance: 'Attendance',
  daf: 'DAF Tracker', appointments: 'Appointments'
};

// ============ DATA CACHE ============
const dataCache = new Map();
const DATA_TTL = 5 * 60 * 1000;
function cacheKey(action, extra) { return action + '|' + JSON.stringify(extra || {}); }
function cacheGet(key) {
  const hit = dataCache.get(key);
  if (!hit) return null;
  if (Date.now() - hit.ts > DATA_TTL) { dataCache.delete(key); return null; }
  return hit.data;
}
function cacheSet(key, data) { dataCache.set(key, { ts: Date.now(), data }); }
function cacheClear() { dataCache.clear(); }

// ============ SESSION ============
function getStoredToken() {
  try { return sessionStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
}
function setStoredToken(t) {
  try { if (t) sessionStorage.setItem(TOKEN_KEY, t); else sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
}
function clearSession() {
  session = null;
  setStoredToken('');
  dataCache.clear();
}

// ============ FETCH ============
function fetchWithTimeout(url, opts, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms || FETCH_TIMEOUT_MS);
  return fetch(url, Object.assign({ signal: ctrl.signal }, opts || {}))
    .finally(() => clearTimeout(t));
}

async function apiGet(paramsObj, extra) {
  const period = currentPeriod;
  const key = cacheKey(paramsObj.action, Object.assign({ period }, extra || {}));
  const hit = cacheGet(key);
  if (hit) return hit;
  const params = new URLSearchParams({ token: session.token, ...paramsObj });
  const res = await fetchWithTimeout(`${API}?${params}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (!json.ok) {
    if (json.error === 'SESSION_EXPIRED') { handleSessionExpired(); throw new Error('Session expired — please sign in again'); }
    throw new Error(json.error || 'API error');
  }
  cacheSet(key, json.data);
  return json.data;
}

async function apiPost(payload) {
  const res = await fetchWithTimeout(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: session.token, ...payload })
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (!json.ok) {
    if (json.error === 'SESSION_EXPIRED') { handleSessionExpired(); throw new Error('Session expired — please sign in again'); }
    throw new Error(json.error || 'API error');
  }
  return json.data;
}

// ============ UI HELPERS ============
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]); }
function round(n) { return Math.round(Number(n || 0) * 100) / 100; }
function badge(v, good, warn) {
  const c = v >= good ? 'text-green-600' : v >= warn ? 'text-amber-600' : 'text-red-600';
  return `<span class="${c} font-semibold">${round(v)}</span>`;
}
function setDot(page, state) {
  const dot = document.querySelector(`[data-dot="${page}"]`);
  if (!dot) return;
  dot.className = 'status-dot ' + (state === 'ready' ? 'dot-ready' : state === 'loading' ? 'dot-loading' : state === 'error' ? 'dot-error' : 'dot-idle');
}

let overlayCount = 0;
function showOverlay(title, hint) {
  overlayCount++;
  document.getElementById('overlayTitle').textContent = title || 'Loading...';
  document.getElementById('overlayHint').textContent = hint || 'Please wait';
  document.getElementById('overlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}
function hideOverlay() {
  overlayCount = Math.max(0, overlayCount - 1);
  if (overlayCount === 0) {
    document.getElementById('overlay').classList.add('hidden');
    document.body.style.overflow = '';
  }
}

let toastTimer = null;
function showToast(label) {
  const t = document.getElementById('toast');
  document.getElementById('toastText').textContent = label + ' ready';
  t.classList.remove('hidden');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.classList.add('hidden'); }, 1800);
}

function showError(title, message, retryFn) {
  document.getElementById('content').innerHTML = `
    <div class="bg-red-50 border border-red-200 rounded-xl p-6 max-w-2xl mx-auto text-center">
      <div class="text-red-700 font-semibold mb-2">${esc(title)}</div>
      <div class="text-red-600 text-sm mb-4">${esc(message)}</div>
      <button id="retryBtn" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-medium">Retry</button>
    </div>
  `;
  const b = document.getElementById('retryBtn');
  if (b && retryFn) b.addEventListener('click', retryFn);
}

// ============ CHART REGISTRY ============
const chartRegistry = [];
function makeChart(canvasEl, config) {
  if (!canvasEl) return;
  const existing = Chart.getChart(canvasEl);
  if (existing) existing.destroy();
  const c = new Chart(canvasEl, config);
  chartRegistry.push(c);
  return c;
}
function destroyAllCharts() {
  while (chartRegistry.length) {
    try { chartRegistry.pop().destroy(); } catch (e) {}
  }
}

// ============ LOGIN FLOW ============
function showLogin() {
  document.getElementById('loginScreen').classList.remove('hidden');
}
function hideLogin() {
  document.getElementById('loginScreen').classList.add('hidden');
}
function setLoginError(msg) {
  const el = document.getElementById('loginError');
  if (!msg) { el.classList.add('hidden'); el.textContent = ''; return; }
  el.textContent = msg;
  el.classList.remove('hidden');
}
function handleSessionExpired() {
  clearSession();
  showLogin();
  setLoginError('Your session expired. Please sign in again.');
}

async function submitLogin(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  setLoginError('');
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    const res = await fetchWithTimeout(API, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'login', email, password })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Login failed');
    session = { token: json.data.token, email: json.data.email, name: json.data.name, role: json.data.role };
    setStoredToken(session.token);
    document.getElementById('userEmail').textContent = session.email;
    document.getElementById('userRole').textContent = session.role || 'viewer';
    document.getElementById('loginPassword').value = '';
    hideLogin();
    await boot();
  } catch (err) {
    setLoginError(err.message || 'Invalid email or password');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
}
document.getElementById('loginForm').addEventListener('submit', submitLogin);

document.getElementById('logoutBtn').addEventListener('click', async () => {
  try { await apiGet({ action: 'logout' }); } catch (e) {}
  clearSession();
  showLogin();
});

// ============ AGENT MODAL ============
async function openAgentProfile(name) {
  const modal = document.getElementById('agentModal');
  const box = document.getElementById('agentModalContent');
  modal.classList.remove('hidden');
  box.innerHTML = `<div class="text-center py-20 text-sm text-slate-500">Loading profile...</div>`;
  try {
    const data = await apiGet({ action: 'agentProfile', name });
    const p = data.profile || {};
    const daf = data.dafPoints || { points: 0, incidents: 0, irs: 0 };
    box.innerHTML = `
      <div class="flex items-start justify-between mb-6">
        <div class="flex items-center gap-4">
          <div class="w-16 h-16 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-2xl font-bold">${esc((name.split(',')[0] || '?').charAt(0))}</div>
          <div>
            <h2 class="text-2xl font-bold text-slate-900">${esc(name)}</h2>
            <p class="text-sm text-slate-500">${esc(p.position || '—')}${p.wave ? ' · ' + esc(p.wave) : ''}${p.employmentStatus ? ' · ' + esc(p.employmentStatus) : ''}</p>
          </div>
        </div>
        <div class="flex items-center gap-4">
          <div class="bg-gradient-to-br from-red-500 to-red-600 text-white rounded-xl px-5 py-3 shadow-sm text-right">
            <div class="text-red-100 text-[10px] font-medium uppercase">Total DAF Points</div>
            <div class="text-2xl font-bold">${round(daf.points)}</div>
            <div class="text-red-100 text-[10px]">${daf.incidents} incidents · ${daf.irs} IRs</div>
          </div>
          <button onclick="closeAgentModal()" class="text-slate-400 hover:text-slate-700 text-2xl leading-none">✕</button>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-5 mb-6">
        <div class="bg-slate-50 rounded-xl p-4">
          <h3 class="text-xs font-semibold text-slate-500 uppercase mb-3">Employment</h3>
          <div class="space-y-2 text-sm">
            <div class="flex justify-between"><span class="text-slate-500">Immediate Head</span><span class="font-medium text-slate-800">${esc(p.immediateHead || '—')}</span></div>
            <div class="flex justify-between"><span class="text-slate-500">Shift</span><span class="font-medium text-slate-800">${esc(p.shift || '—')}</span></div>
            <div class="flex justify-between"><span class="text-slate-500">Hire Date</span><span class="font-medium text-slate-800">${esc(p.hireDate || '—')}</span></div>
          </div>
        </div>
        <div class="bg-slate-50 rounded-xl p-4">
          <h3 class="text-xs font-semibold text-slate-500 uppercase mb-3">Contact</h3>
          <div class="space-y-2 text-sm">
            <div class="flex justify-between"><span class="text-slate-500">Email</span><span class="font-medium text-slate-800 truncate ml-2 text-right">${esc(p.email || '—')}</span></div>
            <div class="flex justify-between"><span class="text-slate-500">Mobile</span><span class="font-medium text-slate-800">${esc(p.mobile || '—')}</span></div>
            <div class="flex justify-between"><span class="text-slate-500">Birthday</span><span class="font-medium text-slate-800">${esc(p.birthday || '—')}</span></div>
          </div>
        </div>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-5 mb-5">
        <h3 class="font-semibold text-slate-900 mb-3">📊 Assessment Score Trend</h3>
        <div class="h-64"><canvas id="modalAssessChart"></canvas></div>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-5 mb-5">
        <h3 class="font-semibold text-slate-900 mb-3">📈 QA Performance Score Trend</h3>
        <div class="h-64"><canvas id="modalQaChart"></canvas></div>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-5">
        <h3 class="font-semibold text-slate-900 mb-3">📋 Criteria Accuracy</h3>
        ${data.criteriaTable && data.criteriaTable.rows && data.criteriaTable.rows.length > 0 ? `
          <table class="w-full text-sm">
            <thead class="bg-slate-50 border-b border-slate-200">
              <tr>
                <th class="text-left px-3 py-2 font-semibold text-slate-600">Criterion</th>
                <th class="text-right px-3 py-2 font-semibold text-slate-600">Yes</th>
                <th class="text-right px-3 py-2 font-semibold text-slate-600">No</th>
                <th class="text-right px-3 py-2 font-semibold text-slate-600">Total</th>
                <th class="text-right px-3 py-2 font-semibold text-slate-600">Accuracy</th>
              </tr>
            </thead>
            <tbody>
              ${data.criteriaTable.rows.map(r => {
                const accColor = r.accuracy >= 95 ? 'text-green-600' : r.accuracy >= 90 ? 'text-amber-600' : 'text-red-600';
                return `<tr class="border-b border-slate-100">
                  <td class="px-3 py-2 text-slate-700">${esc(r.criterion)}</td>
                  <td class="px-3 py-2 text-right text-slate-600">${r.yes}</td>
                  <td class="px-3 py-2 text-right text-slate-600">${r.no}</td>
                  <td class="px-3 py-2 text-right text-slate-600">${r.total}</td>
                  <td class="px-3 py-2 text-right font-semibold ${accColor}">${r.accuracy.toFixed(2)}%</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        ` : '<div class="text-slate-400 text-sm py-4">No criteria data.</div>'}
      </div>
    `;
    const aT = data.assessmentTrend || { months: [], scores: [] };
    const qT = data.qaTrend || { months: [], scores: [] };
    makeChart(document.getElementById('modalAssessChart'), {
      type: 'line',
      data: { labels: aT.months, datasets: [{ label: 'Assessment Score', data: aT.scores, borderColor: '#7c3aed', backgroundColor: 'rgba(124, 58, 237, 0.1)', borderWidth: 3, fill: true, tension: 0.35, pointRadius: 4, spanGaps: true }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { suggestedMin: 50, suggestedMax: 100 } } }
    });
    makeChart(document.getElementById('modalQaChart'), {
      type: 'line',
      data: { labels: qT.months, datasets: [{ label: 'QA Score', data: qT.scores, borderColor: '#16a34a', backgroundColor: 'rgba(22, 163, 74, 0.1)', borderWidth: 3, fill: true, tension: 0.35, pointRadius: 4, spanGaps: true }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { suggestedMin: 60, suggestedMax: 100 } } }
    });
  } catch (err) {
    box.innerHTML = `<div class="text-red-600 p-4">Failed to load profile: ${esc(err.message)}</div>`;
  }
}
function closeAgentModal() { document.getElementById('agentModal').classList.add('hidden'); }
window.openAgentProfile = openAgentProfile;
window.closeAgentModal = closeAgentModal;
document.getElementById('agentModal').addEventListener('click', (e) => { if (e.target.id === 'agentModal') closeAgentModal(); });

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-agent-name]');
  if (!el) return;
  const name = el.getAttribute('data-agent-name');
  if (name) openAgentProfile(name);
});

// ============ RENDERERS ============
async function renderOverview(token) {
  const data = await apiGet({ action: 'overviewFull' });
  if (token !== navToken) return;

async function editAttendanceCell(td) {
  if (td.dataset.editing === '1') return;
  td.dataset.editing = '1';
  const currentValue = td.dataset.value || '';
  const codes = ['P', 'A', 'RD', 'TB', 'VL', 'SL', 'LWP', 'UT', 'Holiday', 'SLP', ''];
  const select = document.createElement('select');
  select.className = 'w-full text-xs';
  codes.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c || '—';
    if (c === currentValue) opt.selected = true;
    select.appendChild(opt);
  });
  const original = td.innerHTML;
  td.innerHTML = '';
  td.appendChild(select);
  select.focus();

  let done = false;
  const commit = async () => {
    if (done) return;
    done = true;
    const newValue = select.value;
    td.dataset.editing = '0';
    if (newValue === currentValue) { td.innerHTML = original; return; }
    td.classList.add('saving');
    td.innerHTML = newValue || '—';
    try {
      await apiPost({ action: 'updateAttendanceCell', tabName: currentAttendanceTabName, rowNumber: td.dataset.row, colIndex: td.dataset.col, value: newValue });
      td.dataset.value = newValue;
      td.classList.remove('saving');
      td.classList.add('saved');
      const st = document.getElementById('saveStatus');
      if (st) { st.textContent = '✓ Saved'; st.className = 'text-xs font-medium text-green-600'; }
      setTimeout(() => { td.classList.remove('saved'); if (st) st.textContent = ''; }, 1500);
      dataCache.clear();
    } catch (e) {
      td.classList.remove('saving');
      td.classList.add('error');
      td.innerHTML = original;
      const st = document.getElementById('saveStatus');
      if (st) { st.textContent = 'Save failed: ' + e.message; st.className = 'text-xs font-medium text-red-600'; }
    }
  };
  select.addEventListener('change', commit);
  select.addEventListener('blur', () => { if (!done) commit(); });
  select.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') select.blur();
    if (ev.key === 'Escape') { done = true; td.dataset.editing = '0'; td.innerHTML = original; }
  });
}
window.editAttendanceCell = editAttendanceCell;

    extra.startPeriod = `${DAF_MONTHS[now.getMonth()]} ${now.getFullYear()}`;

}

    <div class="bg-white rounded-xl shadow-sm mb-6">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between">
        <h3 class="font-semibold text-slate-900">🗂️ Raw Data Log</h3>
        <div class="flex items-center gap-3">
          <span class="text-xs text-slate-500">Click any cell to edit</span>

        </div>
      </div>

    </div>

      <div class="p-4 border-b border-slate-200 flex items-center justify-between">
        <h3 class="font-semibold text-slate-900">🗂️ IR Tracker</h3>
        <div class="flex items-center gap-3">
          <span class="text-xs text-slate-500">Click any cell to edit</span>
          <span id="dafIRSaveStatus" class="text-xs font-medium"></span>

  const daily = data.dailyTrend || [];

  if (ey) ey.addEventListener('change', (e) => { dafEndYear = e.target.value; navigate('daf'); });

  await renderDAFGrid('raw');

}

async function renderDAFGrid(which) {
  const containerId = which === 'raw' ? 'dafRawGrid' : 'dafIRGrid';
  const saveStatusId = which === 'raw' ? 'dafRawSaveStatus' : 'dafIRSaveStatus';
  const action = which === 'raw' ? 'dafRawGrid' : 'dafIRGrid';
  const container = document.getElementById(containerId);
  if (!container) return;

  const grid = await apiGet({ action }, dafQueryExtra());
  if (grid.error) { container.innerHTML = `<div class="bg-red-50 text-red-700 p-4 rounded-lg">Error: ${esc(grid.error)}</div>`; return; }
  const validColIdx = grid.headers.findIndex(h => String(h || '').toLowerCase().trim() === 'valid');

  function fmtCell(v, colIdx) {
    if (colIdx === validColIdx) {
      const s = String(v || '').trim().toLowerCase();
      if (s === 'true') return '✓';
      if (s === 'false') return '—';
      return esc(v) || '<span class="text-slate-300">—</span>';
    }
    return esc(v) || '<span class="text-slate-300">—</span>';
  }

  let html = `<table class="w-full text-xs" style="border-collapse: collapse;">
    <thead class="bg-slate-100">
      <tr>
        <th class="px-2 py-2 text-left font-semibold text-slate-600 border border-slate-200 bg-slate-200">Row</th>
        ${grid.headers.map(h => `<th class="px-2 py-2 text-left font-semibold text-slate-600 border border-slate-200 whitespace-nowrap">${esc(h)}</th>`).join('')}
      </tr>
    </thead><tbody>`;

  if (!grid.rows || grid.rows.length === 0) {
    html += `<tr><td colspan="${grid.headers.length + 1}" class="px-2 py-4 text-slate-400 text-center">No rows match the current filter.</td></tr>`;
  }
  (grid.rows || []).forEach(r => {
    html += `<tr class="hover:bg-slate-50">`;
    html += `<td class="px-2 py-1 text-slate-400 border border-slate-200 bg-slate-50">${r.rowNumber}</td>`;
    r.cells.forEach((v, ci) => {
      const display = fmtCell(v, ci);
      html += `<td class="daf-edit-cell" style="padding:4px 6px; border: 1px solid #e2e8f0; cursor: pointer; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" data-tab="${esc(grid.tabName)}" data-row="${r.rowNumber}" data-col="${ci}" data-value="${esc(v)}" title="${esc(v)}" onclick="editDAFCell(this)">${display}</td>`;
    });
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  container.innerHTML = html;
  container.dataset.saveStatusId = saveStatusId;
}

async function editDAFCell(td) {
  if (td.dataset.editing === '1') return;
  td.dataset.editing = '1';
  const colIdx = Number(td.dataset.col);
  const tabName = td.dataset.tab;
  const isRawValid = tabName === 'Raw Data' && colIdx === 4;
  const rawValue = td.dataset.value || '';
  const currentValue = isRawValid ? (String(rawValue).toLowerCase() === 'true' ? '✓' : '') : rawValue;
  const originalHtml = td.innerHTML;

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'w-full text-xs px-1 py-0.5 border border-blue-400 rounded';
  input.value = currentValue;
  if (isRawValid) input.placeholder = '✓ or blank';
  td.innerHTML = '';
  td.appendChild(input);
  input.focus();
  input.select();

  let done = false;
  const commit = async () => {
    if (done) return;
    done = true;
    let newValue = input.value.trim();
    if (isRawValid) {
      const truthy = ['✓', 'true', 'yes', 'y', '1', 'x'];
      newValue = truthy.includes(newValue.toLowerCase()) ? 'TRUE' : 'FALSE';
    }
    td.dataset.editing = '0';
    if (newValue === rawValue) { td.innerHTML = originalHtml; return; }
    td.style.background = '#fef3c7';
    try {
      await apiPost({ action: 'updateDAFCell', tabName: td.dataset.tab, rowNumber: td.dataset.row, colIndex: td.dataset.col, value: newValue });
      td.dataset.value = newValue;
      let display = isRawValid ? (newValue === 'TRUE' ? '✓' : '—') : (esc(newValue) || '<span class="text-slate-300">—</span>');
      td.innerHTML = display;
      td.style.background = '#d1fae5';
      setTimeout(() => { td.style.background = ''; }, 1000);
      const container = td.closest('[id$="Grid"]');
      const stId = container ? container.dataset.saveStatusId : null;
      if (stId) {
        const st = document.getElementById(stId);
        if (st) { st.textContent = '✓ Saved'; st.className = 'text-xs font-medium text-green-600'; setTimeout(() => { st.textContent = ''; }, 1500); }
      }
      dataCache.clear();
    } catch (e) {
      td.style.background = '#fee2e2';
      td.innerHTML = originalHtml;
      const container = td.closest('[id$="Grid"]');
      const stId = container ? container.dataset.saveStatusId : null;
      if (stId) {
        const st = document.getElementById(stId);
        if (st) { st.textContent = 'Save failed: ' + e.message; st.className = 'text-xs font-medium text-red-600'; }
      }
    }
  };
  input.addEventListener('blur', () => { if (!done) commit(); });
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') input.blur();
    if (ev.key === 'Escape') { done = true; td.dataset.editing = '0'; td.innerHTML = originalHtml; }
  });
}
window.editDAFCell = editDAFCell;

// ============ NAVIGATION ============
const renderers = {
  overview: renderOverview, kpi: renderKPI, markdowns: renderMarkdowns,
  teams: renderTeams, agents: renderAgents,
  attendance: renderAttendance, daf: renderDAF,
  appointments: async () => { document.getElementById('content').innerHTML = '<div class="text-slate-400 text-center py-20">Coming soon</div>'; }
};

let navToken = 0;

async function navigate(page) {
  const myToken = ++navToken;
  currentPage = page;

  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  document.getElementById('pageTitle').textContent = PAGE_LABELS[page] || page;

  destroyAllCharts();
  setDot(page, 'loading');
  showOverlay('Loading ' + (PAGE_LABELS[page] || page), 'Please wait...');
  document.getElementById('content').innerHTML = '<div class="text-center py-20 text-slate-400">Loading...</div>';

  try {
    await renderers[page](myToken);
    if (myToken !== navToken) return;
    setDot(page, 'ready');
    document.getElementById('lastSync').textContent = `Last synced ${new Date().toLocaleString()} · ${currentPeriod}`;
    showToast(PAGE_LABELS[page] || page);
  } catch (e) {
    if (myToken !== navToken) return;
    setDot(page, 'error');
    showError('Failed to load ' + (PAGE_LABELS[page] || page), e.message || 'Unknown error', () => navigate(page));
  } finally {
    if (myToken === navToken) hideOverlay();
  }
}

document.querySelectorAll('.sidebar-item').forEach(el => {
  el.addEventListener('click', (e) => { e.preventDefault(); navigate(el.dataset.page); });
});

document.querySelectorAll('.period-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    periodMode = btn.dataset.mode;
    document.querySelectorAll('.period-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === periodMode);
      b.classList.toggle('text-slate-600', b.dataset.mode !== periodMode);
    });
    populatePeriodSelect();
    navigate(currentPage);
  });
});

document.getElementById('periodSelect').addEventListener('change', (e) => {
  currentPeriod = e.target.value;
  navigate(currentPage);
});

document.getElementById('refreshBtn').addEventListener('click', () => {
  dataCache.clear();
  Object.keys(PAGE_LABELS).forEach(p => setDot(p, 'idle'));
  navigate(currentPage);
});

// ============ BOOT ============
async function loadPeriods() {
  PERIODS = await apiGet({ action: 'periods' });
  const list = PERIODS.month || [];
  if (list.length && !list.includes(currentPeriod)) currentPeriod = list[0];
  populatePeriodSelect();
}
function populatePeriodSelect() {
  const sel = document.getElementById('periodSelect');
  const list = PERIODS[periodMode] || [];
  if (!list.length) { sel.innerHTML = '<option value="">No data</option>'; return; }
  sel.innerHTML = list.map(v => `<option value="${v}">${v}</option>`).join('');
  if (list.includes(currentPeriod)) sel.value = currentPeriod;
  else { currentPeriod = list[0]; sel.value = currentPeriod; }
}

async function boot() {
  showOverlay('Connecting', 'Fetching periods...');
  try {
    await loadPeriods();
    hideOverlay();
    navigate('overview');
  } catch (e) {
    hideOverlay();
    if (String(e.message).indexOf('Session expired') !== -1) return;
    showError('Cannot connect to backend', e.message || 'The API did not respond.', () => location.reload());
  }
}

(async () => {
  // Try restoring a stored token
  const stored = getStoredToken();
  if (stored) {
    // We don't know the role/email yet; fetch /me via a quick ping-like call
    session = { token: stored, email: '', name: '', role: '' };
    try {
      const me = await apiGet({ action: 'me' });
      session.email = me.email;
      session.name = me.name;
      session.role = me.role;
      document.getElementById('userEmail').textContent = session.email;
      document.getElementById('userRole').textContent = session.role || 'viewer';
      await boot();
      return;
    } catch (e) {
      // Token was bad — fall through to login
      clearSession();
    }
  }
  showLogin();
})();
