<script>
const API = 'https://script.google.com/macros/s/AKfycbzkAS-C4KUmrGca9LgO-VzJ0SUhlq3d6wpL0gLJ2MVvNzgVKgfyBZqHkRgvgY_xzhf9/exec';
const EMAIL = 'jentera.idgc@gmail.com';
const CACHE_TTL = 5 * 60 * 1000;

let currentPage = 'overview';
let periodMode = 'month';
let currentPeriod = 'August 2026';
let PERIODS = { month: [], quarter: [], year: [] };
let loadingTimer = null;
let loadingStarted = 0;

class SmartCache {
  constructor() { this.cache = new Map(); this.hits = 0; this.misses = 0; this.loadFromLocalStorage(); }
  _key(a, p, e) { return `${a}|${p}|${JSON.stringify(e || {})}`; }
  get(a, p, e = {}) {
    const k = this._key(a, p, e);
    const hit = this.cache.get(k);
    if (!hit) { this.misses++; this.updateStatus(); return null; }
    if (Date.now() - hit.timestamp > CACHE_TTL) { this.cache.delete(k); this.misses++; this.updateStatus(); return null; }
    this.hits++; this.updateStatus(); return hit.data;
  }
  set(a, p, e = {}, data) {
    this.cache.set(this._key(a, p, e), { data, timestamp: Date.now() });
    this.saveToLocalStorage(); this.updateStatus();
  }
  clear() { this.cache.clear(); this.hits = 0; this.misses = 0; localStorage.removeItem('wf_cache'); this.updateStatus(); }
  saveToLocalStorage() { try { localStorage.setItem('wf_cache', JSON.stringify([...this.cache.entries()])); } catch (e) {} }
  loadFromLocalStorage() {
    try {
      const raw = localStorage.getItem('wf_cache');
      if (!raw) return;
      const arr = JSON.parse(raw);
      const now = Date.now();
      arr.forEach(([k, v]) => { if (now - v.timestamp < CACHE_TTL) this.cache.set(k, v); });
    } catch (e) {}
  }
  updateStatus() {
    const total = this.hits + this.misses;
    const rate = total ? Math.round((this.hits / total) * 100) : 0;
    const el = document.getElementById('cacheStatus');
    if (el) el.textContent = `Cache: ${this.cache.size} entries, ${rate}% hit rate`;
  }
  getStats() { const t = this.hits + this.misses; return { size: this.cache.size, hitRate: t ? (this.hits / t) * 100 : 0 }; }
}
const clientCache = new SmartCache();

async function api(action, extra = {}) {
  const hit = clientCache.get(action, currentPeriod, extra);
  if (hit !== null) return hit;
  const params = new URLSearchParams({ action, email: EMAIL, period: currentPeriod, ...extra });
  const res = await fetch(`${API}?${params}`);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'API error');
  clientCache.set(action, currentPeriod, extra, json.data);
  return json.data;
}

async function loadPeriods() {
  const params = new URLSearchParams({ action: 'periods', email: EMAIL });
  const res = await fetch(`${API}?${params}`);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  PERIODS = json.data;
}

function populatePeriodSelect() {
  const sel = document.getElementById('periodSelect');
  const list = PERIODS[periodMode] || [];
  if (!list.length) { sel.innerHTML = '<option value="">No data</option>'; return; }
  sel.innerHTML = list.map(v => `<option value="${v}">${v}</option>`).join('');
  if (list.includes(currentPeriod)) {
    sel.value = currentPeriod;
  } else {
    currentPeriod = list[0];
    sel.value = currentPeriod;
  }
}

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]); }
function round(n) { return Math.round(Number(n || 0) * 100) / 100; }
function badge(v, good, warn) {
  const c = v >= good ? 'text-green-600' : v >= warn ? 'text-amber-600' : 'text-red-600';
  return `<span class="${c} font-semibold">${round(v)}</span>`;
}

// ============ LOADING BAR (percent) ============
function startLoading(label) {
  loadingStarted = Date.now();
  const bar = document.getElementById('loadingBar');
  const prog = document.getElementById('loadingProgress');
  const txt = document.getElementById('loadingText');
  const pct = document.getElementById('loadingPercent');

  if (bar) bar.classList.remove('hidden');
  if (prog) prog.style.width = '0%';
  if (pct) pct.textContent = '0%';
  if (txt) txt.textContent = (label || 'Loading') + '...';

  if (loadingTimer) clearInterval(loadingTimer);

  loadingTimer = setInterval(() => {
    const current = parseFloat((prog && prog.style.width) || '0');
    let increment;
    if (current < 30) increment = 8;
    else if (current < 60) increment = 4;
    else if (current < 80) increment = 2;
    else if (current < 90) increment = 1;
    else increment = 0.3;

    const next = Math.min(90, current + increment);
    if (prog) prog.style.width = next + '%';
    if (pct) pct.textContent = Math.round(next) + '%';
  }, 200);
}

function stopLoading() {
  if (loadingTimer) { clearInterval(loadingTimer); loadingTimer = null; }
  const elapsed = ((Date.now() - loadingStarted) / 1000).toFixed(1);

  const prog = document.getElementById('loadingProgress');
  const pct = document.getElementById('loadingPercent');
  const txt = document.getElementById('loadingText');

  if (prog) prog.style.width = '100%';
  if (pct) pct.textContent = '100%';
  if (txt) txt.textContent = 'Done · ' + elapsed + 's';

  setTimeout(() => {
    const bar = document.getElementById('loadingBar');
    if (bar) bar.classList.add('hidden');
  }, 400);

  return elapsed;
}

            <th class="text-left px-4 py-3 font-semibold text-slate-600">#</th>
            <th class="text-left px-4 py-3 font-semibold text-slate-600">Agent</th>
            <th class="text-left px-4 py-3 font-semibold text-slate-600">Team</th>
            <th class="text-right px-4 py-3 font-semibold text-slate-600">QA</th>
            <th class="text-right px-4 py-3 font-semibold text-slate-600">Att</th>
            <th class="text-right px-4 py-3 font-semibold text-slate-600">AHT</th>
            <th class="text-right px-4 py-3 font-semibold text-slate-600">Assess</th>
            <th class="text-right px-4 py-3 font-semibold text-slate-600">KPI</th>
          </tr>
        </thead>
        <tbody>
          ${rows.sort((a, b) => b.kpi - a.kpi).map((r, i) => `
            <tr class="border-b border-slate-100 hover:bg-slate-50">
              <td class="px-4 py-2 text-slate-400">${i + 1}</td>
              <td class="px-4 py-2 font-medium text-slate-800 agent-link" onclick="openAgentProfile('${r.name.replace(/'/g, "\\'")}')">${esc(r.name)}</td>
              <td class="px-4 py-2 text-slate-500 text-xs">${esc(r.team || '')}</td>
              <td class="px-4 py-2 text-right">${badge(r.qa, 90, 80)}</td>
              <td class="px-4 py-2 text-right text-slate-600">${r.attComponent}</td>
              <td class="px-4 py-2 text-right text-slate-600">${r.ahtComponent}</td>
              <td class="px-4 py-2 text-right text-slate-600">${r.assessComponent}</td>
              <td class="px-4 py-2 text-right font-bold text-blue-600">${round(r.kpi)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

// ============ MARKDOWNS ============
async function renderMarkdowns() {
  const rows = await api('markdowns', { scope: 'all' });
  document.getElementById('content').innerHTML = `
    <div class="bg-white rounded-xl p-5 shadow-sm">
      <h3 class="font-semibold text-slate-900 mb-4">🎯 Where agents lose points — ${esc(currentPeriod)}</h3>
      <div class="space-y-3">
        ${rows.map(r => {
          const max = rows[0].failures || 1;
          const pct = (r.failures / max) * 100;
          return `
            <div>
              <div class="flex justify-between text-sm mb-1 gap-4">
                <span class="text-slate-700 font-medium">${esc(r.criterion)}</span>
                <span class="text-slate-500 whitespace-nowrap">${r.failures} failures</span>
              </div>
              <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full bg-red-500 rounded-full" style="width: ${pct}%"></div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

// ============ TEAMS ============
async function renderTeams() {
  const teams = await api('teams');
  document.getElementById('content').innerHTML = `
    <div class="grid grid-cols-2 gap-5">
      ${teams.map(t => `
        <div class="bg-white rounded-xl p-5 shadow-sm">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-semibold">
              ${esc((t.teamLeader.split(',')[0] || '?').charAt(0))}
            </div>
            <div>
              <div class="font-semibold text-slate-900">${esc(t.teamLeader)}</div>
              <div class="text-xs text-slate-500">Team Leader · ${t.agents.length} agents</div>
            </div>
          </div>
          <div class="space-y-1">
            ${t.agents.slice(0, 8).map(a => `
              <div class="text-sm text-slate-600 flex items-center gap-2">
                <span class="text-slate-400">•</span>
                <span class="agent-link" onclick="openAgentProfile('${a.name.replace(/'/g, "\\'")}')">${esc(a.name)}</span>
                ${a.position ? `<span class="text-xs text-slate-400">(${esc(a.position)})</span>` : ''}
              </div>
            `).join('')}
            ${t.agents.length > 8 ? `<div class="text-xs text-slate-400 mt-1">+ ${t.agents.length - 8} more</div>` : ''}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

// ============ AGENTS ============
async function renderAgents() {
  const agents = await api('agents');
  document.getElementById('content').innerHTML = `
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-slate-50 border-b border-slate-200">
          <tr>
            <th class="text-left px-4 py-3 font-semibold text-slate-600">Agent</th>
            <th class="text-left px-4 py-3 font-semibold text-slate-600">Team</th>
            <th class="text-left px-4 py-3 font-semibold text-slate-600">Position</th>
            <th class="text-right px-4 py-3 font-semibold text-slate-600">Audits</th>
            <th class="text-right px-4 py-3 font-semibold text-slate-600">Avg Score</th>
          </tr>
        </thead>
        <tbody>
          ${agents.sort((a, b) => b.avgScore - a.avgScore).map(a => `
            <tr class="border-b border-slate-100 hover:bg-slate-50">
              <td class="px-4 py-2 font-medium text-slate-800 agent-link" onclick="openAgentProfile('${a.name.replace(/'/g, "\\'")}')">${esc(a.name)}</td>
              <td class="px-4 py-2 text-slate-500 text-xs">${esc(a.team || '')}</td>
              <td class="px-4 py-2 text-slate-500 text-xs">${esc(a.position || '')}</td>
              <td class="px-4 py-2 text-right text-slate-600">${a.audits}</td>
              <td class="px-4 py-2 text-right">${badge(a.avgScore, 90, 80)}%</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

const comingSoon = async () => {
  document.getElementById('content').innerHTML = '<div class="text-slate-400 text-center py-20">Coming soon</div>';
};

const renderers = {
  overview: renderOverview, kpi: renderKPI, markdowns: renderMarkdowns,
  teams: renderTeams, agents: renderAgents,
  attendance: comingSoon, daf: comingSoon, appointments: comingSoon, users: comingSoon,
};

async function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  const labels = { overview: 'Dashboard Overview', kpi: 'KPI Report', markdowns: 'Markdown Analytics', teams: 'Team Management', agents: 'Agents / CSRs', attendance: 'Attendance', daf: 'DAF Tracker', appointments: 'Appointments', users: 'Users' };
  document.getElementById('pageTitle').textContent = labels[page] || page;

  const cached = clientCache.get(page, currentPeriod, {});
  if (!cached) startLoading('Loading ' + (labels[page] || page));

  document.getElementById('content').innerHTML = '<div class="text-center py-20 text-slate-400">Loading...</div>';
  try {
    await renderers[page]();
    const stats = clientCache.getStats();
    if (cached) {
      document.getElementById('lastSync').textContent = `From cache · ${currentPeriod} · Cache: ${Math.round(stats.hitRate)}% hit rate`;
    } else {
      const elapsed = stopLoading();
      document.getElementById('lastSync').textContent = `Loaded in ${elapsed}s · ${currentPeriod} · Cache: ${Math.round(stats.hitRate)}% hit rate`;
    }
  } catch (e) {
    stopLoading();
    document.getElementById('content').innerHTML = `<div class="bg-red-50 text-red-700 p-4 rounded-lg">Error: ${esc(e.message)}</div>`;
  }
}

document.querySelectorAll('.sidebar-item').forEach(el => {
  el.addEventListener('click', (e) => { e.preventDefault(); navigate(el.dataset.page); });
});

document.querySelectorAll('.period-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    periodMode = btn.dataset.mode;
    document.querySelectorAll('.period-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === periodMode);
      b.classList.toggle('text-slate-600', b.dataset.mode !== periodMode);
    });
    populatePeriodSelect();
    navigate(currentPage);
  });
});

document.getElementById('periodSelect').addEventListener('change', (e) => {
  currentPeriod = e.target.value;
  navigate(currentPage);
});

document.getElementById('clearCacheBtn').addEventListener('click', () => {
  clientCache.clear();
  navigate(currentPage);
});

(async () => {
  try {
    await loadPeriods();
    if (PERIODS.month && PERIODS.month.length) {
      if (!PERIODS.month.includes(currentPeriod)) currentPeriod = PERIODS.month[0];
    }
    populatePeriodSelect();
    navigate('overview');
  } catch (e) {
    document.getElementById('content').innerHTML = `<div class="bg-red-50 text-red-700 p-4 rounded-lg">Failed to load periods: ${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
