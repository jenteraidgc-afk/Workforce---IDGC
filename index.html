<script>
const API = 'https://script.google.com/macros/s/AKfycbzkAS-C4KUmrGca9LgO-VzJ0SUhlq3d6wpL0gLJ2MVvNzgVKgfyBZqHkRgvgY_xzhf9/exec';
const EMAIL = 'jentera.idgc@gmail.com';
const CACHE_TTL = 5 * 60 * 1000;

let currentPage = 'overview';
let periodMode = 'month';
let currentPeriod = 'August 2026';
let PERIODS = { month: [], quarter: [], year: [] };

const PREFETCH_ACTIONS = [
  { action: 'overviewFull', label: 'Overview' },
  { action: 'kpi',          label: 'KPI Report' },
  { action: 'markdowns',    label: 'Markdowns', extra: { scope: 'all' } },
  { action: 'teams',        label: 'Teams' },
  { action: 'agents',       label: 'Agents' },
];

// ============ DATA CACHE (JSON) ============
class SmartCache {
  constructor() { this.cache = new Map(); this.hits = 0; this.misses = 0; this.loadFromLocalStorage(); }
  _key(a, p, e) { return `${a}|${p}|${JSON.stringify(e || {})}`; }
  get(a, p, e = {}) {
    const k = this._key(a, p, e);
    const hit = this.cache.get(k);
    if (!hit) { this.misses++; this.updateStatus(); return null; }
    if (Date.now() - hit.timestamp > CACHE_TTL) { this.cache.delete(k); this.misses++; this.updateStatus(); return null; }
    this.hits++; this.updateStatus(); return hit.data;
  }
  set(a, p, e = {}, data) {
    this.cache.set(this._key(a, p, e), { data, timestamp: Date.now() });
    this.saveToLocalStorage(); this.updateStatus();
  }
  has(a, p, e = {}) {
    const k = this._key(a, p, e);
    const hit = this.cache.get(k);
    return hit && (Date.now() - hit.timestamp < CACHE_TTL);
  }
  clear() { this.cache.clear(); this.hits = 0; this.misses = 0; localStorage.removeItem('wf_cache'); this.updateStatus(); }
  saveToLocalStorage() { try { localStorage.setItem('wf_cache', JSON.stringify([...this.cache.entries()])); } catch (e) {} }
  loadFromLocalStorage() {
    try {
      const raw = localStorage.getItem('wf_cache');
      if (!raw) return;
      const arr = JSON.parse(raw);
      const now = Date.now();
      arr.forEach(([k, v]) => { if (now - v.timestamp < CACHE_TTL) this.cache.set(k, v); });
    } catch (e) {}
  }
  updateStatus() {
    const total = this.hits + this.misses;
    const rate = total ? Math.round((this.hits / total) * 100) : 0;
    const el = document.getElementById('cacheStatus');
    if (el) el.textContent = `Cache: ${this.cache.size} entries, ${rate}% hit rate`;
  }
  getStats() { const t = this.hits + this.misses; return { size: this.cache.size, hitRate: t ? (this.hits / t) * 100 : 0 }; }
}
const clientCache = new SmartCache();

// ============ PAGE CACHE (RENDERED HTML + CHARTS) ============
// Stores the full #content HTML plus all Chart.js configs so we can
// restore a previously-visited page instantly without re-fetching.
const pageCache = new Map();   // key: `${page}|${period}` → { html, charts, scrollY, savedAt }
let chartConfigs = {};         // live chart configs for the currently-rendering page
const liveCharts = [];         // live Chart.js instances (for destroying on re-render)

function pageCacheKey(page, period) { return `${page}|${period}`; }

function stashChart(id, config) {
  chartConfigs[id] = config;
}

// Destroy all live Chart.js instances to prevent leaks before replacing HTML
function destroyLiveCharts() {
  while (liveCharts.length) {
    try { liveCharts.pop().destroy(); } catch (e) {}
  }
}

// Replay stored chart configs after restoring cached HTML
function replayCharts(configs) {
  if (!configs) return;
  Object.keys(configs).forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const cfg = configs[id];
    try { liveCharts.push(new Chart(el, cfg)); } catch (e) { console.warn('Chart replay failed:', id, e); }
  });
}

function invalidatePage(page) {
  // Invalidate for all periods of that page
  [...pageCache.keys()].forEach(k => { if (k.startsWith(page + '|')) pageCache.delete(k); });
}

function invalidateAllPages() { pageCache.clear(); }

async function api(action, extra = {}) {
  const hit = clientCache.get(action, currentPeriod, extra);
  if (hit !== null) return hit;
  const params = new URLSearchParams({ action, email: EMAIL, period: currentPeriod, ...extra });
  const res = await fetch(`${API}?${params}`);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'API error');
  clientCache.set(action, currentPeriod, extra, json.data);
  return json.data;
}

async function apiPost(payload) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'API error');
  return json.data;
}

async function loadPeriods() {
  const params = new URLSearchParams({ action: 'periods', email: EMAIL });
  const res = await fetch(`${API}?${params}`);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  PERIODS = json.data;
}

function populatePeriodSelect() {
  const sel = document.getElementById('periodSelect');
  const list = PERIODS[periodMode] || [];
  if (!list.length) { sel.innerHTML = '<option value="">No data</option>'; return; }
  sel.innerHTML = list.map(v => `<option value="${v}">${v}</option>`).join('');
  if (list.includes(currentPeriod)) {
    sel.value = currentPeriod;
  } else {
    currentPeriod = list[0];
    sel.value = currentPeriod;
  }
}

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]); }
function round(n) { return Math.round(Number(n || 0) * 100) / 100; }
function badge(v, good, warn) {
  const c = v >= good ? 'text-green-600' : v >= warn ? 'text-amber-600' : 'text-red-600';
  return `<span class="${c} font-semibold">${round(v)}</span>`;
}

function showLoadingBar() { const b = document.getElementById('loadingBar'); if (b) b.classList.remove('hidden'); }
function hideLoadingBar() { const b = document.getElementById('loadingBar'); if (b) b.classList.add('hidden'); }
function setLoadingStatus(done, total, currentLabel) {
  const pctVal = total > 0 ? Math.round((done / total) * 100) : 0;
  const prog = document.getElementById('loadingProgress');
  const pct = document.getElementById('loadingPercent');
  const txt = document.getElementById('loadingText');
  if (prog) prog.style.width = pctVal + '%';
  if (pct) pct.textContent = pctVal + '%';
  if (txt) {
    if (done >= total) txt.textContent = 'Ready';
    else txt.textContent = `Loading ${done + 1} of ${total}: ${currentLabel || '...'}`;
  }
}

async function prefetchAll() {
  const pending = PREFETCH_ACTIONS.filter(p => !clientCache.has(p.action, currentPeriod, p.extra || {}));
  const total = PREFETCH_ACTIONS.length;
  const alreadyDone = total - pending.length;
  if (pending.length === 0) { hideLoadingBar(); return; }
  showLoadingBar();
  setLoadingStatus(alreadyDone, total, pending[0].label);
  let completed = alreadyDone;
  await Promise.all(pending.map(async (p) => {
    try { await api(p.action, p.extra || {}); } catch (e) { console.warn('Prefetch failed:', p.action, e.message); }
    completed++;
    setLoadingStatus(completed, total, p.label);
  }));
  await new Promise(r => setTimeout(r, 400));
  hideLoadingBar();
}

  document.getElementById('content').innerHTML = `

async function editAttendanceCell(td) {
  if (td.dataset.editing === '1') return;
  const currentValue = td.dataset.value || '';
  const codes = ['P', 'A', 'RD', 'TB', 'VL', 'SL', 'LWP', 'UT', 'Holiday', 'SLP', ''];
  const select = document.createElement('select');
  select.className = 'w-full text-xs';
  codes.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c || '—';
    if (c === currentValue) opt.selected = true;
    select.appendChild(opt);
  });
  const original = td.innerHTML;
  td.innerHTML = '';
  td.appendChild(select);
  td.dataset.editing = '1';
  select.focus();

  const commit = async () => {
    const newValue = select.value;
    td.dataset.editing = '0';
    if (newValue === currentValue) { td.innerHTML = original; return; }
    td.classList.add('saving');
    td.innerHTML = newValue || '—';
    try {
      await apiPost({ action: 'updateAttendanceCell', tabName: currentAttendanceTabName, rowNumber: td.dataset.row, colIndex: td.dataset.col, value: newValue, email: EMAIL });
      td.dataset.value = newValue;
      td.classList.remove('saving');
      td.classList.add('saved');
      const st = document.getElementById('saveStatus');
      if (st) { st.textContent = '✓ Saved'; st.className = 'text-xs font-medium text-green-600'; }
      setTimeout(() => { td.classList.remove('saved'); if (st) st.textContent = ''; }, 1500);
      // Invalidate this page in the render cache so next visit re-fetches
      invalidatePage('attendance');
    } catch (e) {
      td.classList.remove('saving');
      td.classList.add('error');
      td.innerHTML = original;
      const st = document.getElementById('saveStatus');
      if (st) { st.textContent = 'Save failed: ' + e.message; st.className = 'text-xs font-medium text-red-600'; }
    }
  };
  select.addEventListener('change', commit);
  select.addEventListener('blur', commit);
  select.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') select.blur();
    if (ev.key === 'Escape') { td.dataset.editing = '0'; td.innerHTML = original; }
  });
}
window.editAttendanceCell = editAttendanceCell;

function dafQuery() {
  const p = new URLSearchParams({ email: EMAIL, filterMode: dafFilterMode });

  } else if (dafFilterMode === 'thisMonth') {

    p.set('endPeriod', `${DAF_MONTHS[now.getMonth()]} ${now.getFullYear()}`);
  }
  return p;
}

// ============ DAF GHOST ROW + MULTI-SELECT HIDE ============
const ghostRowState = {
  raw: { active: false, values: [] },
  ir:  { active: false, values: [] }
};
const gridHeaders = { raw: [], ir: [] };
const hiddenRows = { raw: new Set(), ir: new Set() };
const selectedRows = { raw: new Set(), ir: new Set() };
const lastClickedRow = { raw: null, ir: null };
const showHidden = { raw: false, ir: false };
const visibleRowNumbers = { raw: [], ir: [] };

function activateGhostRow(which) {
  ghostRowState[which].active = true;
  ghostRowState[which].values = [];
  renderDAFGrid(which);
}

function cancelGhostRow(which) {
  ghostRowState[which].active = false;
  ghostRowState[which].values = [];
  renderDAFGrid(which);
}

function setGhostValue(which, colIdx, value) {
  ghostRowState[which].values[colIdx] = value;
}

async function saveGhostRow(which) {
  const state = ghostRowState[which];
  const values = state.values || [];
  const isEmpty = values.every(v => !String(v || '').trim());
  if (isEmpty) { cancelGhostRow(which); return; }

  const action = which === 'raw' ? 'addDAFRow' : 'addIRRow';
  const statusId = which === 'raw' ? 'dafRawSaveStatus' : 'dafIRSaveStatus';
  const st = document.getElementById(statusId);
  if (st) { st.textContent = 'Saving...'; st.className = 'text-xs font-medium text-slate-500'; }

  try {
    const headers = gridHeaders[which] || [];
    const padded = [];
    for (let i = 0; i < headers.length; i++) {
      padded.push(values[i] !== undefined ? values[i] : '');
    }
    await apiPost({ action, values: padded, email: EMAIL });
    ghostRowState[which].active = false;
    ghostRowState[which].values = [];
    clientCache.clear();
    invalidatePage('daf');
    if (st) { st.textContent = '✓ Row added'; st.className = 'text-xs font-medium text-green-600'; setTimeout(() => { st.textContent = ''; }, 2000); }
    await renderDAF();
  } catch (e) {
    if (st) { st.textContent = 'Add failed: ' + e.message; st.className = 'text-xs font-medium text-red-600'; }
  }
}

function toggleRowSelection(which, rowNumber, shiftKey) {
  const sel = selectedRows[which];
  const anchor = lastClickedRow[which];

  if (shiftKey && anchor !== null) {
    const visible = visibleRowNumbers[which];
    const a = visible.indexOf(anchor);
    const b = visible.indexOf(rowNumber);
    if (a !== -1 && b !== -1) {
      const [start, end] = a < b ? [a, b] : [b, a];
      for (let i = start; i <= end; i++) sel.add(visible[i]);
      renderDAFGrid(which);
      return;
    }
  }

  if (sel.has(rowNumber)) sel.delete(rowNumber);
  else sel.add(rowNumber);
  lastClickedRow[which] = rowNumber;
  renderDAFGrid(which);
}

function hideSelected(which) {
  const sel = selectedRows[which];
  if (sel.size === 0) return;
  sel.forEach(rn => hiddenRows[which].add(rn));
  sel.clear();
  lastClickedRow[which] = null;
  renderDAFGrid(which);
}

function toggleShowHidden(which) {
  showHidden[which] = !showHidden[which];
  renderDAFGrid(which);
}

function unhideAll(which) {
  hiddenRows[which].clear();
  showHidden[which] = false;
  renderDAFGrid(which);
}

function clearSelection(which) {
  selectedRows[which].clear();
  lastClickedRow[which] = null;
  renderDAFGrid(which);
}

function selectAllVisible(which) {
  const all = visibleRowNumbers[which];
  const sel = selectedRows[which];
  const allSelected = all.length > 0 && all.every(rn => sel.has(rn));
  if (allSelected) sel.clear();
  else all.forEach(rn => sel.add(rn));
  renderDAFGrid(which);
}

async function renderDAFGrid(which) {
  const containerId = which === 'raw' ? 'dafRawGrid' : 'dafIRGrid';
  const saveStatusId = which === 'raw' ? 'dafRawSaveStatus' : 'dafIRSaveStatus';
  const action = which === 'raw' ? 'dafRawGrid' : 'dafIRGrid';
  const container = document.getElementById(containerId);
  if (!container) return;

  let grid;
  try {
    const params = dafQuery();
    params.set('action', action);
    const res = await fetch(`${API}?${params}`);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'API error');
    grid = json.data;
  } catch (e) {
    container.innerHTML = `<div class="bg-red-50 text-red-700 p-4 rounded-lg">Failed to load: ${esc(e.message)}</div>`;
    return;
  }

  if (grid.error) {
    container.innerHTML = `<div class="bg-red-50 text-red-700 p-4 rounded-lg">Error: ${esc(grid.error)}</div>`;
    return;
  }

  gridHeaders[which] = grid.headers || [];
  const validColIdx = grid.headers.findIndex(h => String(h || '').toLowerCase().trim() === 'valid');

  function fmtCell(v, colIdx) {
    if (colIdx === validColIdx) {
      const s = String(v || '').trim().toLowerCase();
      if (s === 'true') return '✓';
      if (s === 'false') return '—';
      return esc(v) || '<span class="text-slate-300">—</span>';
    }
    return esc(v) || '<span class="text-slate-300">—</span>';
  }

  const allRows = grid.rows || [];
  const hidden = hiddenRows[which];
  const show = showHidden[which];

  const displayedRows = allRows.filter(r => {
    const isHidden = hidden.has(r.rowNumber);
    return show ? true : !isHidden;
  });

  visibleRowNumbers[which] = displayedRows.map(r => r.rowNumber);

  const presentRows = new Set(allRows.map(r => r.rowNumber));
  selectedRows[which].forEach(rn => { if (!presentRows.has(rn)) selectedRows[which].delete(rn); });
  hidden.forEach(rn => { if (!presentRows.has(rn)) hidden.delete(rn); });

  const hiddenCount = hidden.size;
  const selectedCount = selectedRows[which].size;
  const allVisibleSelected = visibleRowNumbers[which].length > 0 &&
    visibleRowNumbers[which].every(rn => selectedRows[which].has(rn));

  let toolbarHtml = `
    <div class="flex items-center justify-between mb-2 flex-wrap gap-2">
      <div class="text-xs text-slate-500">
        Check rows to select · <strong>Shift+Click</strong> for range · <strong>Ctrl/Cmd+Click</strong> to add
      </div>
      <div class="flex items-center gap-2">
        ${selectedCount > 0 ? `<button onclick="clearSelection('${which}')" class="text-xs px-3 py-1.5 rounded-lg bg-white border border-slate-300 hover:bg-slate-50 text-slate-700">Clear (${selectedCount})</button>` : ''}
        ${selectedCount > 0 ? `<button onclick="hideSelected('${which}')" class="text-xs px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-600 text-white font-medium">Hide selected (${selectedCount})</button>` : ''}
        ${hiddenCount > 0 ? `<button onclick="toggleShowHidden('${which}')" class="text-xs px-3 py-1.5 rounded-lg bg-slate-700 hover:bg-slate-800 text-white font-medium">${show ? 'Hide' : 'Show'} hidden (${hiddenCount})</button>` : ''}
        ${hiddenCount > 0 ? `<button onclick="unhideAll('${which}')" class="text-xs px-3 py-1.5 rounded-lg bg-white border border-slate-300 hover:bg-slate-50 text-slate-700">Reset</button>` : ''}
        <button onclick="activateGhostRow('${which}')" class="text-xs px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium transition">+ Add Row</button>
      </div>
    </div>
  `;

  let html = toolbarHtml + `
    <table class="w-full text-xs" style="border-collapse: collapse;">
      <thead class="bg-slate-100">
        <tr>
          <th class="px-2 py-2 border border-slate-200 bg-slate-200" style="width:32px;">
            <input type="checkbox" ${allVisibleSelected ? 'checked' : ''} onchange="selectAllVisible('${which}')" title="Select all" style="cursor:pointer;" />
          </th>
          <th class="px-2 py-2 text-left font-semibold text-slate-600 border border-slate-200 bg-slate-200">Row</th>
          ${grid.headers.map(h => `<th class="px-2 py-2 text-left font-semibold text-slate-600 border border-slate-200 whitespace-nowrap">${esc(h)}</th>`).join('')}
        </tr>
      </thead>
      <tbody>
  `;

  if (displayedRows.length === 0) {
    const msg = allRows.length === 0
      ? 'No rows match the current filter.'
      : (hiddenCount > 0 && !show ? 'All rows in this filter are hidden. Click "Show hidden" to bring them back.' : 'No rows to display.');
    html += `<tr><td colspan="${grid.headers.length + 2}" class="px-2 py-4 text-slate-400 text-center">${msg}</td></tr>`;
  }

  displayedRows.forEach(r => {
    const isHidden = hidden.has(r.rowNumber);
    const isSelected = selectedRows[which].has(r.rowNumber);
    const rowClass = isSelected ? 'bg-blue-100' : (isHidden ? 'bg-slate-100 opacity-60' : 'hover:bg-slate-50');
    html += `<tr class="${rowClass}">`;
    html += `<td class="px-2 py-1 text-center border border-slate-200 bg-slate-50" style="width:32px;">
      <input type="checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); toggleRowSelection('${which}', ${r.rowNumber}, event.shiftKey)" style="cursor:pointer;" />
    </td>`;
    html += `<td class="px-2 py-1 text-slate-400 border border-slate-200 bg-slate-50">${r.rowNumber}</td>`;
    r.cells.forEach((v, ci) => {
      const display = fmtCell(v, ci);
      html += `<td class="daf-edit-cell" style="padding:4px 6px; border: 1px solid #e2e8f0; cursor: pointer; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" data-tab="${esc(grid.tabName)}" data-row="${r.rowNumber}" data-col="${ci}" data-value="${esc(v)}" title="${esc(v)}" onclick="event.stopPropagation(); editDAFCell(this)">${display}</td>`;
    });
    html += `</tr>`;
  });

  if (ghostRowState[which].active) {
    html += `<tr style="background:#eff6ff;" id="ghostRow-${which}">`;
    html += `<td class="px-2 py-1 border border-blue-200 bg-blue-50"></td>`;
    html += `<td class="px-2 py-1 text-blue-600 font-semibold border border-blue-200 text-center">NEW</td>`;
    grid.headers.forEach((h, ci) => {
      const val = ghostRowState[which].values[ci] || '';
      const isLast = ci === grid.headers.length - 1;
      html += `<td class="border border-blue-200" style="padding:0;">
        <input
          type="text"
          class="ghost-input w-full text-xs px-1.5 py-1 border-0 focus:outline-none focus:ring-2 focus:ring-blue-400 bg-transparent"
          data-which="${which}"
          data-col="${ci}"
          value="${esc(val)}"
          placeholder="${esc(h)}"
          oninput="setGhostValue('${which}', ${ci}, this.value)"
          onkeydown="handleGhostKey(event, '${which}', ${ci}, ${grid.headers.length}, ${isLast})"
        />
      </td>`;
    });
    html += `</tr>`;

    html += `<tr style="background:#eff6ff;"><td colspan="${grid.headers.length + 2}" class="px-2 py-2 text-right border border-blue-200">
      <span class="text-xs text-blue-600 mr-3">Press <strong>Enter</strong> in the last cell to save, <strong>Esc</strong> to cancel</span>
      <button onclick="cancelGhostRow('${which}')" class="text-xs px-3 py-1 rounded bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 mr-2">✗ Cancel</button>
      <button onclick="saveGhostRow('${which}')" class="text-xs px-3 py-1 rounded bg-blue-600 hover:bg-blue-700 text-white font-medium">✓ Save</button>
    </td></tr>`;
  }

  html += `</tbody></table>`;
  container.innerHTML = html;
  container.dataset.saveStatusId = saveStatusId;

  if (ghostRowState[which].active) {
    const first = container.querySelector('.ghost-input');
    if (first) first.focus();
  }
}

function handleGhostKey(ev, which, colIdx, totalCols, isLast) {
  if (ev.key === 'Escape') {
    ev.preventDefault();
    cancelGhostRow(which);
    return;
  }
  if (ev.key === 'Enter') {
    ev.preventDefault();
    if (isLast) {
      saveGhostRow(which);
    } else {
      const next = ev.target.closest('td').nextElementSibling?.querySelector('input');
      if (next) next.focus();
      else saveGhostRow(which);
    }
    return;
  }
  if (ev.key === 'Tab' && !ev.shiftKey && isLast) {
    ev.preventDefault();
    saveGhostRow(which);
  }
}

async function editDAFCell(td) {
  if (td.dataset.editing === '1') return;
  const colIdx = Number(td.dataset.col);
  const tabName = td.dataset.tab;
  const isRawValid = tabName === 'Raw Data' && colIdx === 4;

  const rawValue = td.dataset.value || '';
  const currentValue = isRawValid
    ? (String(rawValue).toLowerCase() === 'true' ? '✓' : '')
    : rawValue;

  const originalHtml = td.innerHTML;

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'w-full text-xs px-1 py-0.5 border border-blue-400 rounded';
  input.value = currentValue;
  if (isRawValid) input.placeholder = '✓ or leave blank';
  td.innerHTML = '';
  td.appendChild(input);
  td.dataset.editing = '1';
  input.focus();
  input.select();

  const commit = async () => {
    let newValue = input.value.trim();
    if (isRawValid) {
      const truthy = ['✓', 'true', 'yes', 'y', '1', 'x'];
      newValue = truthy.includes(newValue.toLowerCase()) ? 'TRUE' : 'FALSE';
    }
    td.dataset.editing = '0';
    if (newValue === rawValue) { td.innerHTML = originalHtml; return; }
    td.style.background = '#fef3c7';
    try {
      await apiPost({
        action: 'updateDAFCell',
        tabName: td.dataset.tab,
        rowNumber: td.dataset.row,
        colIndex: td.dataset.col,
        value: newValue,
        email: EMAIL
      });
      td.dataset.value = newValue;
      let display;
      if (isRawValid) {
        display = newValue === 'TRUE' ? '✓' : '—';
      } else {
        display = esc(newValue) || '<span class="text-slate-300">—</span>';
      }
      td.innerHTML = display;
      td.style.background = '#d1fae5';
      setTimeout(() => { td.style.background = ''; }, 1000);
      const container = td.closest('[id$="Grid"]');
      const stId = container ? container.dataset.saveStatusId : null;
      if (stId) {
        const st = document.getElementById(stId);
        if (st) { st.textContent = '✓ Saved'; st.className = 'text-xs font-medium text-green-600'; setTimeout(() => { st.textContent = ''; }, 1500); }
      }
      invalidatePage('daf');
    } catch (e) {
      td.style.background = '#fee2e2';
      td.innerHTML = originalHtml;
      const container = td.closest('[id$="Grid"]');
      const stId = container ? container.dataset.saveStatusId : null;
      if (stId) {
        const st = document.getElementById(stId);
        if (st) { st.textContent = 'Save failed: ' + e.message; st.className = 'text-xs font-medium text-red-600'; }
      }
    }
  };

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') input.blur();
    if (ev.key === 'Escape') { td.dataset.editing = '0'; td.innerHTML = originalHtml; }
  });
}
window.editDAFCell = editDAFCell;

window.activateGhostRow = activateGhostRow;
window.cancelGhostRow = cancelGhostRow;
window.setGhostValue = setGhostValue;
window.saveGhostRow = saveGhostRow;
window.handleGhostKey = handleGhostKey;
window.toggleRowSelection = toggleRowSelection;
window.hideSelected = hideSelected;
window.toggleShowHidden = toggleShowHidden;
window.unhideAll = unhideAll;
window.clearSelection = clearSelection;
window.selectAllVisible = selectAllVisible;

// ============ PAGE SNAPSHOT / RESTORE ============
function snapshotCurrentPage() {
  if (!currentPage) return;
  const el = document.getElementById('content');
  if (!el) return;
  const key = pageCacheKey(currentPage, currentPeriod);
  pageCache.set(key, {
    html: el.innerHTML,
    charts: JSON.parse(JSON.stringify(chartConfigs)),
    scrollY: window.scrollY,
    savedAt: Date.now()
  });
}

function restoreFromSnapshot(page) {
  const key = pageCacheKey(page, currentPeriod);
  const snapshot = pageCache.get(key);
  if (!snapshot) return false;

  destroyLiveCharts();
  const el = document.getElementById('content');
  el.innerHTML = snapshot.html;

  // Rebuild charts using stored configs
  chartConfigs = snapshot.charts || {};
  replayCharts(chartConfigs);

  // Restore scroll position after a tick so layout settles
  requestAnimationFrame(() => { window.scrollTo(0, snapshot.scrollY || 0); });

  // Rebind any event listeners that were attached programmatically
  rebindPageEvents(page);
  return true;
}

function rebindPageEvents(page) {
  // Attendance: month dropdown
  if (page === 'attendance') {
    const sel = document.getElementById('attMonthSelect');
    if (sel) {
      sel.addEventListener('change', async (e) => {
        currentAttendanceTabName = e.target.value;
        await renderAttendanceGrid();
        snapshotCurrentPage();
      });
    }
  }
  // DAF: filter dropdowns
  if (page === 'daf') {
    const fm = document.getElementById('dafFilterMode');
    if (fm) fm.addEventListener('change', (e) => { dafFilterMode = e.target.value; invalidatePage('daf'); renderDAF(); });
    const sm = document.getElementById('dafStartMonth');
    const sy = document.getElementById('dafStartYear');
    const em = document.getElementById('dafEndMonth');
    const ey = document.getElementById('dafEndYear');
    if (sm) sm.addEventListener('change', (e) => { dafStartMonth = e.target.value; invalidatePage('daf'); renderDAF(); });
    if (sy) sy.addEventListener('change', (e) => { dafStartYear = e.target.value; invalidatePage('daf'); renderDAF(); });
    if (em) em.addEventListener('change', (e) => { dafEndMonth = e.target.value; invalidatePage('daf'); renderDAF(); });
    if (ey) ey.addEventListener('change', (e) => { dafEndYear = e.target.value; invalidatePage('daf'); renderDAF(); });
  }
}

// ============ NAVIGATION ============
const comingSoon = async () => {
  chartConfigs = {};
  document.getElementById('content').innerHTML = '<div class="text-slate-400 text-center py-20">Coming soon</div>';
};

const renderers = {
  overview: renderOverview, kpi: renderKPI, markdowns: renderMarkdowns,
  teams: renderTeams, agents: renderAgents,
  attendance: renderAttendance,
  daf: renderDAF,
  appointments: comingSoon, users: comingSoon,
};

async function navigate(page) {
  const previousPage = currentPage;
  currentPage = page;

  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));
  const labels = { overview: 'Dashboard Overview', kpi: 'KPI Report', markdowns: 'Markdown Analytics', teams: 'Team Management', agents: 'Agents / CSRs', attendance: 'Attendance', daf: 'DAF Tracker', appointments: 'Appointments', users: 'Users' };
  document.getElementById('pageTitle').textContent = labels[page] || page;

  // Snapshot the page we're leaving BEFORE switching away
  if (previousPage && previousPage !== page) {
    snapshotCurrentPage();
  }

  // Try restoring from page cache first
  if (pageCache.has(pageCacheKey(page, currentPeriod))) {
    restoreFromSnapshot(page);
    const stats = clientCache.getStats();
    document.getElementById('lastSync').textContent = `Last synced ${new Date(pageCache.get(pageCacheKey(page, currentPeriod)).savedAt).toLocaleString()} · ${currentPeriod} · Cache: ${Math.round(stats.hitRate)}% hit rate`;
    return;
  }

  // Cache miss — do the full fetch/render
  const simpleFetches = { kpi: 'kpi', markdowns: 'markdowns', teams: 'teams', agents: 'agents', overview: 'overviewFull' };
  const cacheKey = simpleFetches[page];
  const alreadyCached = cacheKey ? clientCache.has(cacheKey, currentPeriod, page === 'markdowns' ? { scope: 'all' } : {}) : true;
  if (!alreadyCached) { showLoadingBar(); setLoadingStatus(0, 1, labels[page]); }
  document.getElementById('content').innerHTML = '<div class="text-center py-20 text-slate-400">Loading...</div>';
  try {
    destroyLiveCharts();
    chartConfigs = {};
    await renderers[page]();
    // For pages with async sub-renders (attendance grid, daf grids), snapshot happens later
    if (page !== 'attendance' && page !== 'daf') {
      snapshotCurrentPage();
    } else {
      // Wait a tick for the async grid fetches to complete, then snapshot
      setTimeout(() => { snapshotCurrentPage(); }, 1200);
    }
    if (!alreadyCached) { setLoadingStatus(1, 1, labels[page]); await new Promise(r => setTimeout(r, 250)); hideLoadingBar(); }
    const stats = clientCache.getStats();
    document.getElementById('lastSync').textContent = `Last synced ${new Date().toLocaleString()} · ${currentPeriod} · Cache: ${Math.round(stats.hitRate)}% hit rate`;
  } catch (e) {
    if (!alreadyCached) hideLoadingBar();
    document.getElementById('content').innerHTML = `<div class="bg-red-50 text-red-700 p-4 rounded-lg">Error: ${esc(e.message)}</div>`;
  }
}

document.querySelectorAll('.sidebar-item').forEach(el => {
  el.addEventListener('click', (e) => { e.preventDefault(); navigate(el.dataset.page); });
});

document.querySelectorAll('.period-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    periodMode = btn.dataset.mode;
    document.querySelectorAll('.period-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === periodMode);
      b.classList.toggle('text-slate-600', b.dataset.mode !== periodMode);
    });
    populatePeriodSelect();
    invalidateAllPages();
    await prefetchAll();
    navigate(currentPage);
  });
});

document.getElementById('periodSelect').addEventListener('change', async (e) => {
  currentPeriod = e.target.value;
  invalidateAllPages();
  await prefetchAll();
  navigate(currentPage);
});

document.getElementById('clearCacheBtn').addEventListener('click', () => {
  clientCache.clear();
  invalidateAllPages();
  prefetchAll().then(() => navigate(currentPage));
});

(async () => {
  try {
    showLoadingBar();
    setLoadingStatus(0, PREFETCH_ACTIONS.length + 1, 'Periods');
    await loadPeriods();
    if (PERIODS.month && PERIODS.month.length) {
      if (!PERIODS.month.includes(currentPeriod)) currentPeriod = PERIODS.month[0];
    }
    populatePeriodSelect();
    setLoadingStatus(1, PREFETCH_ACTIONS.length + 1, 'Overview');
    const pending = PREFETCH_ACTIONS.filter(p => !clientCache.has(p.action, currentPeriod, p.extra || {}));
    const total = PREFETCH_ACTIONS.length + 1;
    let completed = 1;
    await Promise.all(pending.map(async (p) => {
      try { await api(p.action, p.extra || {}); } catch (e) { console.warn(e); }
      completed++;
      setLoadingStatus(completed, total, p.label);
    }));
    setLoadingStatus(total, total, '');
    await new Promise(r => setTimeout(r, 400));
    hideLoadingBar();
    navigate('overview');
  } catch (e) {
    hideLoadingBar();
    document.getElementById('content').innerHTML = `<div class="bg-red-50 text-red-700 p-4 rounded-lg">Failed to load: ${esc(e.message)}</div>`;
  }
})();
</script>
