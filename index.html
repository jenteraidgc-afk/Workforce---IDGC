<script>
const API = 'https://script.google.com/macros/s/AKfycbzkAS-C4KUmrGca9LgO-VzJ0SUhlq3d6wpL0gLJ2MVvNzgVKgfyBZqHkRgvgY_xzhf9/exec';
const EMAIL = 'jentera.idgc@gmail.com';
const CACHE_TTL = 5 * 60 * 1000;

let currentPage = 'overview';
let periodMode = 'month';
let currentPeriod = 'August 2026';
let PERIODS = { month: [], quarter: [], year: [] };

const PREFETCH_ACTIONS = [
  { action: 'overviewFull', label: 'Overview' },
  { action: 'kpi',          label: 'KPI Report' },
  { action: 'markdowns',    label: 'Markdowns', extra: { scope: 'all' } },
  { action: 'teams',        label: 'Teams' },
  { action: 'agents',       label: 'Agents' },
];

class SmartCache {
  constructor() { this.cache = new Map(); this.hits = 0; this.misses = 0; this.loadFromLocalStorage(); }
  _key(a, p, e) { return `${a}|${p}|${JSON.stringify(e || {})}`; }
  get(a, p, e = {}) {
    const k = this._key(a, p, e);
    const hit = this.cache.get(k);
    if (!hit) { this.misses++; this.updateStatus(); return null; }
    if (Date.now() - hit.timestamp > CACHE_TTL) { this.cache.delete(k); this.misses++; this.updateStatus(); return null; }
    this.hits++; this.updateStatus(); return hit.data;
  }
  set(a, p, e = {}, data) {
    this.cache.set(this._key(a, p, e), { data, timestamp: Date.now() });
    this.saveToLocalStorage(); this.updateStatus();
  }
  has(a, p, e = {}) {
    const k = this._key(a, p, e);
    const hit = this.cache.get(k);
    return hit && (Date.now() - hit.timestamp < CACHE_TTL);
  }
  clear() { this.cache.clear(); this.hits = 0; this.misses = 0; localStorage.removeItem('wf_cache'); this.updateStatus(); }
  saveToLocalStorage() { try { localStorage.setItem('wf_cache', JSON.stringify([...this.cache.entries()])); } catch (e) {} }
  loadFromLocalStorage() {
    try {
      const raw = localStorage.getItem('wf_cache');
      if (!raw) return;
      const arr = JSON.parse(raw);
      const now = Date.now();
      arr.forEach(([k, v]) => { if (now - v.timestamp < CACHE_TTL) this.cache.set(k, v); });
    } catch (e) {}
  }
  updateStatus() {
    const total = this.hits + this.misses;
    const rate = total ? Math.round((this.hits / total) * 100) : 0;
    const el = document.getElementById('cacheStatus');
    if (el) el.textContent = `Cache: ${this.cache.size} entries, ${rate}% hit rate`;
  }
  getStats() { const t = this.hits + this.misses; return { size: this.cache.size, hitRate: t ? (this.hits / t) * 100 : 0 }; }
}
const clientCache = new SmartCache();

async function api(action, extra = {}) {
  const hit = clientCache.get(action, currentPeriod, extra);
  if (hit !== null) return hit;
  const params = new URLSearchParams({ action, email: EMAIL, period: currentPeriod, ...extra });
  const res = await fetch(`${API}?${params}`);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'API error');
  clientCache.set(action, currentPeriod, extra, json.data);
  return json.data;
}

async function apiPost(payload) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'API error');
  return json.data;
}

async function loadPeriods() {
  const params = new URLSearchParams({ action: 'periods', email: EMAIL });
  const res = await fetch(`${API}?${params}`);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  PERIODS = json.data;
}

function populatePeriodSelect() {
  const sel = document.getElementById('periodSelect');
  const list = PERIODS[periodMode] || [];
  if (!list.length) { sel.innerHTML = '<option value="">No data</option>'; return; }
  sel.innerHTML = list.map(v => `<option value="${v}">${v}</option>`).join('');
  if (list.includes(currentPeriod)) {
    sel.value = currentPeriod;
  } else {
    currentPeriod = list[0];
    sel.value = currentPeriod;
  }
}

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]); }
function round(n) { return Math.round(Number(n || 0) * 100) / 100; }
function badge(v, good, warn) {
  const c = v >= good ? 'text-green-600' : v >= warn ? 'text-amber-600' : 'text-red-600';
  return `<span class="${c} font-semibold">${round(v)}</span>`;
}

function showLoadingBar() { const b = document.getElementById('loadingBar'); if (b) b.classList.remove('hidden'); }
function hideLoadingBar() { const b = document.getElementById('loadingBar'); if (b) b.classList.add('hidden'); }
function setLoadingStatus(done, total, currentLabel) {
  const pctVal = total > 0 ? Math.round((done / total) * 100) : 0;
  const prog = document.getElementById('loadingProgress');
  const pct = document.getElementById('loadingPercent');
  const txt = document.getElementById('loadingText');
  if (prog) prog.style.width = pctVal + '%';
  if (pct) pct.textContent = pctVal + '%';
  if (txt) {
    if (done >= total) txt.textContent = 'Ready';
    else txt.textContent = `Loading ${done + 1} of ${total}: ${currentLabel || '...'}`;
  }
}

async function prefetchAll() {
  const pending = PREFETCH_ACTIONS.filter(p => !clientCache.has(p.action, currentPeriod, p.extra || {}));
  const total = PREFETCH_ACTIONS.length;
  const alreadyDone = total - pending.length;
  if (pending.length === 0) { hideLoadingBar(); return; }
  showLoadingBar();
  setLoadingStatus(alreadyDone, total, pending[0].label);
  let completed = alreadyDone;
  await Promise.all(pending.map(async (p) => {
    try { await api(p.action, p.extra || {}); } catch (e) { console.warn('Prefetch failed:', p.action, e.message); }
    completed++;
    setLoadingStatus(completed, total, p.label);
  }));
  await new Promise(r => setTimeout(r, 400));
  hideLoadingBar();
}

// Inline cell editing
async function editAttendanceCell(td) {
  if (td.dataset.editing === '1') return;
  const currentValue = td.dataset.value || '';
  const codes = ['P', 'A', 'RD', 'TB', 'VL', 'SL', 'LWP', 'UT', 'Holiday', 'SLP', ''];

  // Build a small dropdown
  const select = document.createElement('select');
  select.className = 'w-full text-xs';
  codes.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c || '—';
    if (c === currentValue) opt.selected = true;
    select.appendChild(opt);
  });

  const original = td.innerHTML;
  td.innerHTML = '';
  td.appendChild(select);
  td.dataset.editing = '1';
  select.focus();

  const commit = async () => {
    const newValue = select.value;
    td.dataset.editing = '0';
    if (newValue === currentValue) {
      td.innerHTML = original;
      return;
    }
    td.classList.add('saving');
    td.innerHTML = newValue || '—';
    try {
      await apiPost({
        action: 'updateAttendanceCell',
        tabName: currentAttendanceTab(),
        rowNumber: td.dataset.row,
        colIndex: td.dataset.col,
        value: newValue,
        email: EMAIL
      });
      td.dataset.value = newValue;
      td.classList.remove('saving');
      td.classList.add('saved');
      document.getElementById('saveStatus').textContent = 'Saved';
      document.getElementById('saveStatus').className = 'text-xs font-medium text-green-600';
      setTimeout(() => {
        td.classList.remove('saved');
        const st = document.getElementById('saveStatus');
        if (st) st.textContent = '';
      }, 1500);
      // Invalidate attendance cache so next visit refetches
      clientCache.cache.forEach((v, k) => { if (k.startsWith('attendanceGrid|')) clientCache.cache.delete(k); });
    } catch (e) {
      td.classList.remove('saving');
      td.classList.add('error');
      td.innerHTML = original;
      document.getElementById('saveStatus').textContent = 'Save failed: ' + e.message;
      document.getElementById('saveStatus').className = 'text-xs font-medium text-red-600';
    }
  };

  select.addEventListener('change', commit);
  select.addEventListener('blur', commit);
  select.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { select.blur(); }
    if (ev.key === 'Escape') { td.dataset.editing = '0'; td.innerHTML = original; }
  });
}

function currentAttendanceTab() {
  // Read the tab name from the rendered heading
  const h = document.querySelector('#content h3');
  if (h && h.textContent.includes('📅')) return h.textContent.replace('📅', '').trim();
  return currentPeriod;
}

async function navigate(page) {
  currentPage = page;
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.toggle('active', el.dataset.page === page));

  document.getElementById('pageTitle').textContent = labels[page] || page;
  document.getElementById('content').innerHTML = '<div class="text-center py-20 text-slate-400">Loading...</div>';
